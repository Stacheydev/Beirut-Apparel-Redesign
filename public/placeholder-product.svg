<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" role="img" aria-labelledby="title desc">
  <title id="title">Product placeholder</title>
  <desc id="desc">Fashion silhouette placeholder used when a product image is unavailable.</desc>
  <rect width="400" height="520" fill="#EFE9DA"/>
  <g transform="translate(200,260)">
    <!-- torso silhouette -->
    <path d="M0-180 C50-180 80-155 85-120 C90-85 75-30 75 0 C75 30 70 50 65 60 L55 100 L-55 100 L-65 60 C-70 50 -75 30 -75 0 C-75-30 -90-85 -85-120 C-80-155 -50-180 0-180Z" fill="none" stroke="#C4BAA2" stroke-width="3" stroke-linecap="round"/>
    <!-- neck -->
    <line x1="0" y1="-180" x2="0" y2="-200" stroke="#C4BAA2" stroke-width="3" stroke-linecap="round"/>
    <!-- head -->
    <ellipse cx="0" cy="-220" rx="28" ry="34" fill="none" stroke="#C4BAA2" stroke-width="3"/>
    <!-- arms suggestion -->
    <path d="M-75-50 C-100-30 -110 10 -90 50" fill="none" stroke="#C4BAA2" stroke-width="3" stroke-linecap="round"/>
    <path d="M75-50 C100-30 110 10 90 50" fill="none" stroke="#C4BAA2" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
